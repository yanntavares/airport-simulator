# Configuração da simulação do aeroporto.
# Todos os tempos são em milissegundos. Edite e rode de novo.

# Exemplo C1: 3 aviões para pousar, 3 para decolar, 2 pistas
# Exemplo C2: avioes.pousar=4, avioes.decolar=0, pistas=1
avioes.pousar=3
avioes.decolar=3
pistas=2

# Tempo que o avião ocupa a pista
tempo.pouso.ms=2000
tempo.decolagem.ms=2000

# Intervalo entre o pouso e o pedido de decolagem
tempo.solo.ms=4000

# Intervalo entre a decolagem e o novo pedido de pouso
tempo.voo.ms=6000

# Taxa de atualização do painel e se ele limpa a tela (false no console do IntelliJ)
painel.intervalo.ms=1000
painel.limpar-tela=true

# Pousos seguidos antes de deixar uma decolagem passar (evita inanição)
torre.max-pousos-consecutivos=3